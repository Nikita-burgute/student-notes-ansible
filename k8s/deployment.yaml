
apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-notes-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-notes

  template:
    metadata:
      labels:
        app: student-notes

    spec:
      containers:
        - name: student-notes-container
          image: student-notes-app:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
